<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmic Defender</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;display:grid;place-items:center;height:100vh;overflow:hidden;font-family:'Courier New',monospace}
  canvas{background:#000;border:2px solid #0ff;box-shadow:0 0 30px #0ff}
  #ui{position:absolute;top:20px;left:50%;transform:translateX(-50%);color:#0ff;font-size:18px;text-shadow:0 0 10px #0ff;pointer-events:none}
</style>
</head>
<body>
<div id="ui">
  <div id="score">СЧЁТ: 0</div>
  <div id="lives">♥♥♥</div>
  <div id="wave" style="color:#f0f;text-shadow:0 0 10px #f0f">ВОЛНА 1</div>
</div>
<canvas id="game" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Состояние игры
let score = 0, lives = 3, wave = 1, gameOver = false, paused = false;
let spawnTimer = 0, waveTimer = 0, enemiesInWave = 0;

// Игрок
const player = {
  x: W/2, y: H - 80, w: 40, h: 40,
  speed: 300, cooldown: 0, fireRate: 0.2,
  power: 1, invincible: 0
};

// Массивы объектов
let bullets = [], enemies = [], particles = [], powerups = [], stars = [];
const keys = {};

// Звёздный фон (параллакс)
for(let i = 0; i < 150; i++){
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: Math.random() * 2 + 0.5,
    speed: Math.random() * 50 + 20
  });
}

// Управление
addEventListener('keydown', e => {
  keys[e.code] = true;
  if(e.code === 'KeyR' && gameOver) restart();
  if(['Space','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);

function restart(){
  score = 0; lives = 3; wave = 1; gameOver = false;
  player.x = W/2; player.y = H - 80; player.power = 1; player.invincible = 0;
  bullets = []; enemies = []; particles = []; powerups = [];
  spawnTimer = 0; waveTimer = 0; enemiesInWave = 0;
  updateUI();
}

// Создание частиц (взрыв)
function createExplosion(x, y, color, count = 20){
  for(let i = 0; i < count; i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 200 + 100;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: Math.random() * 0.5 + 0.5,
      size: Math.random() * 3 + 2,
      color
    });
  }
}

// Спавн врагов
function spawnEnemy(){
  const type = Math.random();
  let enemy;
  
  if(type < 0.6){ // Обычный
    enemy = {
      x: Math.random() * (W - 40) + 20,
      y: -40,
      w: 30, h: 30,
      vx: (Math.random() - 0.5) * 100,
      vy: 80 + wave * 10,
      hp: 1,
      color: '#f00',
      points: 10,
      shootTimer: Math.random() * 2
    };
  } else if(type < 0.9){ // Быстрый
    enemy = {
      x: Math.random() * (W - 30) + 15,
      y: -30,
      w: 25, h: 25,
      vx: (Math.random() - 0.5) * 200,
      vy: 150 + wave * 15,
      hp: 1,
      color: '#ff0',
      points: 20,
      shootTimer: Math.random() * 3
    };
  } else { // Танк
    enemy = {
      x: Math.random() * (W - 50) + 25,
      y: -50,
      w: 40, h: 40,
      vx: (Math.random() - 0.5) * 60,
      vy: 50 + wave * 5,
      hp: 3,
      maxHp: 3,
      color: '#f0f',
      points: 50,
      shootTimer: Math.random() * 2
    };
  }
  
  enemies.push(enemy);
}

// Стрельба игрока
function playerShoot(){
  if(player.cooldown > 0) return;
  
  if(player.power === 1){
    bullets.push({
      x: player.x, y: player.y - 20,
      vx: 0, vy: -500,
      w: 4, h: 15,
      friendly: true,
      color: '#0ff'
    });
  } else if(player.power === 2){
    bullets.push({
      x: player.x - 10, y: player.y - 15,
      vx: 0, vy: -500,
      w: 4, h: 15,
      friendly: true,
      color: '#0ff'
    });
    bullets.push({
      x: player.x + 10, y: player.y - 15,
      vx: 0, vy: -500,
      w: 4, h: 15,
      friendly: true,
      color: '#0ff'
    });
  } else {
    bullets.push({
      x: player.x - 15, y: player.y - 10,
      vx: -50, vy: -500,
      w: 4, h: 15,
      friendly: true,
      color: '#0ff'
    });
    bullets.push({
      x: player.x, y: player.y - 20,
      vx: 0, vy: -500,
      w: 4, h: 15,
      friendly: true,
      color: '#0ff'
    });
    bullets.push({
      x: player.x + 15, y: player.y - 10,
      vx: 50, vy: -500,
      w: 4, h: 15,
      friendly: true,
      color: '#0ff'
    });
  }
  
  player.cooldown = player.fireRate;
}

// Стрельба врагов
function enemyShoot(enemy){
  bullets.push({
    x: enemy.x, y: enemy.y + enemy.h/2,
    vx: 0, vy: 300,
    w: 4, h: 12,
    friendly: false,
    color: '#f00'
  });
}

// Спавн бонусов
function spawnPowerup(x, y){
  if(Math.random() < 0.15){ // 15% шанс
    const types = ['power', 'life'];
    const type = types[Math.floor(Math.random() * types.length)];
    powerups.push({
      x, y,
      vy: 100,
      type,
      size: 15,
      rotation: 0
    });
  }
}

// Коллизия прямоугольников
function rectCollision(a, b){
  return a.x - a.w/2 < b.x + b.w/2 &&
         a.x + a.w/2 > b.x - b.w/2 &&
         a.y - a.h/2 < b.y + b.h/2 &&
         a.y + a.h/2 > b.y - b.h/2;
}

// Обновление UI
function updateUI(){
  document.getElementById('score').textContent = 'СЧЁТ: ' + score;
  document.getElementById('lives').textContent = '♥'.repeat(lives);
  document.getElementById('wave').textContent = 'ВОЛНА ' + wave;
}

// Основной цикл обновления
function update(dt){
  if(gameOver) return;
  
  // Звёзды
  for(const star of stars){
    star.y += star.speed * dt;
    if(star.y > H){
      star.y = 0;
      star.x = Math.random() * W;
    }
  }
  
  // Игрок
  if(keys.ArrowLeft || keys.KeyA) player.x -= player.speed * dt;
  if(keys.ArrowRight || keys.KeyD) player.x += player.speed * dt;
  player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));
  
  if(keys.Space) playerShoot();
  player.cooldown -= dt;
  player.invincible -= dt;
  
  // Пули
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    
    if(b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20){
      bullets.splice(i, 1);
    }
  }
  
  // Враги
  spawnTimer -= dt;
  if(spawnTimer <= 0 && enemiesInWave < 5 + wave * 2){
    spawnEnemy();
    enemiesInWave++;
    spawnTimer = 1.5 - wave * 0.1;
  }
  
  // Переход на следующую волну
  if(enemiesInWave >= 5 + wave * 2 && enemies.length === 0){
    waveTimer += dt;
    if(waveTimer > 2){
      wave++;
      enemiesInWave = 0;
      waveTimer = 0;
      updateUI();
    }
  }
  
  for(let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    
    // Отскок от стен
    if(e.x < e.w/2 || e.x > W - e.w/2) e.vx *= -1;
    
    // Стрельба
    e.shootTimer -= dt;
    if(e.shootTimer <= 0 && e.y > 0 && e.y < H/2){
      enemyShoot(e);
      e.shootTimer = 2 + Math.random() * 2;
    }
    
    // Удаление если ушёл за экран
    if(e.y > H + 50){
      enemies.splice(i, 1);
      continue;
    }
    
    // Столкновение с игроком
    if(player.invincible <= 0 && rectCollision(player, e)){
      createExplosion(player.x, player.y, '#0ff', 30);
      createExplosion(e.x, e.y, e.color, 20);
      enemies.splice(i, 1);
      lives--;
      player.invincible = 2;
      updateUI();
      if(lives <= 0){
        gameOver = true;
      }
    }
  }
  
  // Коллизии пуль с врагами
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    if(!b.friendly) continue;
    
    for(let j = enemies.length - 1; j >= 0; j--){
      const e = enemies[j];
      if(rectCollision(b, e)){
        e.hp--;
        bullets.splice(i, 1);
        
        if(e.hp <= 0){
          createExplosion(e.x, e.y, e.color, 25);
          score += e.points;
          spawnPowerup(e.x, e.y);
          enemies.splice(j, 1);
          updateUI();
        } else {
          createExplosion(b.x, b.y, '#fff', 5);
        }
        break;
      }
    }
  }
  
  // Коллизии вражеских пуль с игроком
  if(player.invincible <= 0){
    for(let i = bullets.length - 1; i >= 0; i--){
      const b = bullets[i];
      if(b.friendly) continue;
      
      if(rectCollision(b, player)){
        createExplosion(player.x, player.y, '#0ff', 20);
        bullets.splice(i, 1);
        lives--;
        player.invincible = 2;
        updateUI();
        if(lives <= 0){
          gameOver = true;
        }
        break;
      }
    }
  }
  
  // Бонусы
  for(let i = powerups.length - 1; i >= 0; i--){
    const p = powerups[i];
    p.y += p.vy * dt;
    p.rotation += dt * 2;
    
    if(p.y > H + 20){
      powerups.splice(i, 1);
      continue;
    }
    
    if(rectCollision(p, player)){
      if(p.type === 'power'){
        player.power = Math.min(3, player.power + 1);
      } else if(p.type === 'life'){
        lives = Math.min(5, lives + 1);
      }
      createExplosion(p.x, p.y, '#0f0', 15);
      powerups.splice(i, 1);
      updateUI();
    }
  }
  
  // Частицы
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= p.decay * dt;
    
    if(p.life <= 0){
      particles.splice(i, 1);
    }
  }
}

// Отрисовка
function draw(){
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  
  // Звёзды
  ctx.fillStyle = '#fff';
  for(const star of stars){
    ctx.globalAlpha = star.size / 2.5;
    ctx.fillRect(star.x, star.y, star.size, star.size);
  }
  ctx.globalAlpha = 1;
  
  // Игрок
  if(!gameOver){
    ctx.save();
    ctx.translate(player.x, player.y);
    
    if(player.invincible > 0){
      ctx.globalAlpha = 0.5 + Math.sin(player.invincible * 10) * 0.5;
    }
    
    // Корабль
    ctx.fillStyle = '#0ff';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#0ff';
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(-15, 15);
    ctx.lineTo(0, 5);
    ctx.lineTo(15, 15);
    ctx.closePath();
    ctx.fill();
    
    // Двигатель
    ctx.fillStyle = '#ff0';
    ctx.shadowColor = '#ff0';
    ctx.fillRect(-5, 15, 10, 5 + Math.random() * 5);
    
    ctx.restore();
  }
  
  // Враги
  for(const e of enemies){
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = e.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = e.color;
    
    if(e.w > 35){ // Танк
      ctx.fillRect(-e.w/2, -e.h/2, e.w, e.h);
      ctx.fillStyle = '#fff';
      ctx.fillRect(-e.w/2 + 5, -e.h/2 + 5, e.w - 10, 5);
    } else { // Обычный/быстрый
      ctx.beginPath();
      ctx.moveTo(0, e.h/2);
      ctx.lineTo(-e.w/2, -e.h/2);
      ctx.lineTo(e.w/2, -e.h/2);
      ctx.closePath();
      ctx.fill();
    }
    
    // Полоска HP для танков
    if(e.maxHp){
      ctx.fillStyle = '#0f0';
      ctx.fillRect(-e.w/2, -e.h/2 - 8, e.w * (e.hp / e.maxHp), 3);
    }
    
    ctx.restore();
  }
  
  // Пули
  for(const b of bullets){
    ctx.fillStyle = b.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = b.color;
    ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
  }
  
  // Бонусы
  for(const p of powerups){
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    
    ctx.fillStyle = p.type === 'power' ? '#0ff' : '#f00';
    ctx.shadowBlur = 15;
    ctx.shadowColor = ctx.fillStyle;
    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.type === 'power' ? 'P' : '♥', 0, 0);
    
    ctx.restore();
  }
  
  // Частицы
  for(const p of particles){
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  
  // Game Over
  if(gameOver){
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#f00';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#f00';
    ctx.fillText('GAME OVER', W/2, H/2 - 30);
    
    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.shadowColor = '#fff';
    ctx.fillText('СЧЁТ: ' + score, W/2, H/2 + 20);
    ctx.fillText('ВОЛНА: ' + wave, W/2, H/2 + 50);
    
    ctx.fillStyle = '#0ff';
    ctx.font = '18px monospace';
    ctx.shadowColor = '#0ff';
    ctx.fillText('Нажми R для рестарта', W/2, H/2 + 100);
  }
  
  ctx.shadowBlur = 0;
}

// Игровой цикл
let last = performance.now();
function loop(now){
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  
  update(dt);
  draw();
  
  requestAnimationFrame(loop);
}

updateUI();
requestAnimationFrame(loop);
</script>
</body>
</html>
