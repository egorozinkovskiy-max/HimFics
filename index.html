<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ALCHEMIA · PHYSICA — медитативная песочница стихий</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#080b14;--pnl:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--tx:#dfe6f5;--dim:#8d97b0;--acc:#ffd79a;--acc2:#7fe3d0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100dvh;height:100vh;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),transparent)}
header h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.22em;color:var(--acc);white-space:nowrap}
header .sub{color:var(--dim);font-size:11px;letter-spacing:.06em}
header .sp{flex:1}
main{display:grid;grid-template-columns:1fr 320px;min-height:0}
#stage{position:relative;display:flex;align-items:center;justify-content:center;padding:10px;min-width:0;min-height:0}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#box{position:relative;max-width:100%;max-height:100%;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.6)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:crosshair}
#cur{position:absolute;border:1px solid rgba(255,255,255,.55);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);opacity:.8;mix-blend-mode:screen}
#hud{position:absolute;left:10px;top:10px;font:11px/1.5 ui-monospace,monospace;color:#9fb0d0;background:rgba(6,9,18,.5);padding:5px 8px;border-radius:8px;pointer-events:none;white-space:pre}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:rgba(10,14,26,.86);border:1px solid var(--line);color:var(--acc);padding:7px 14px;border-radius:999px;font-size:13px;animation:pop .35s ease, fade .5s ease 2.6s forwards;box-shadow:0 8px 30px rgba(0,0,0,.5)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
@keyframes fade{to{opacity:0;transform:translateY(-6px)}}
aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.02)}
.altar{padding:10px;border-bottom:1px solid var(--line)}
.slots{display:flex;align-items:center;gap:6px}
.slot{flex:1;min-height:52px;border:1px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;background:rgba(255,255,255,.03);cursor:pointer;transition:.2s}
.slot.f{border-style:solid;border-color:rgba(255,215,154,.45);background:rgba(255,215,154,.07)}
.slot.res{border-color:rgba(127,227,208,.4);background:rgba(127,227,208,.07)}
.slot b{font-size:19px;line-height:1}
.slot span{font-size:10px;color:var(--dim);text-align:center}
.op{color:var(--dim);font-size:16px}
.arow{display:flex;gap:6px;margin-top:8px}
.srch{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;gap:6px}
input[type=text]{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 9px;font-size:13px;outline:none}
input[type=text]:focus{border-color:rgba(255,215,154,.4)}
#pal{overflow-y:auto;padding:6px 10px 16px;flex:1;scrollbar-width:thin}
.gh{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:5px}
.chip{position:relative;border:1px solid var(--line);border-radius:9px;padding:6px 4px 5px;text-align:center;background:rgba(255,255,255,.03);cursor:pointer;transition:.15s;user-select:none}
.chip:hover{background:rgba(255,255,255,.08);transform:translateY(-1px)}
.chip.on{border-color:var(--acc);background:rgba(255,215,154,.12)}
.chip.idea{opacity:.85}
.chip.lock{opacity:.28;cursor:default}
.chip b{display:block;font-size:17px;line-height:1.15}
.chip i{display:block;font-style:normal;font-size:10px;color:#c3cde4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip u{position:absolute;right:2px;top:2px;text-decoration:none;font-size:10px;opacity:.5;padding:1px 3px;border-radius:5px}
.chip u:hover{opacity:1;background:rgba(255,255,255,.12)}
footer{border-top:1px solid var(--line);padding:7px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(255,255,255,.02)}
button{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;transition:.15s;font-family:inherit}
button:hover{background:rgba(255,255,255,.11)}
button.on{border-color:var(--acc);color:var(--acc);background:rgba(255,215,154,.12)}
button.mini{padding:4px 8px;font-size:11px}
.grp{display:flex;gap:4px;align-items:center;padding:3px 6px;border:1px solid var(--line);border-radius:9px}
.grp label{font-size:10px;color:var(--dim);letter-spacing:.05em}
input[type=range]{width:76px;accent-color:var(--acc)}
.sep{width:1px;height:22px;background:var(--line)}
#modal{position:fixed;inset:0;background:rgba(4,6,12,.82);backdrop-filter:blur(6px);display:none;z-index:50}
#modal.open{display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:min(940px,100%);max-height:88dvh;max-height:88vh;background:#0b0f1c;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.tabs{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.body{overflow-y:auto;padding:14px 16px 22px}
.card{border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:7px;background:rgba(255,255,255,.025)}
.card h4{margin:0 0 4px;font-size:13px;font-weight:600}
.card p{margin:2px 0;font-size:12px;color:#b9c3da}
.mono{font:12px/1.5 ui-monospace,SFMono-Regular,monospace;color:var(--acc2)}
.dim{color:var(--dim)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:7px}
a{color:var(--acc)}
.prog{height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .5s}
@media(max-width:860px){main{grid-template-columns:1fr;grid-template-rows:1fr auto}aside{border-left:0;border-top:1px solid var(--line);max-height:42dvh;max-height:42vh}aside.hide{display:none}header h1{font-size:12px;letter-spacing:.14em}header .sub{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>

        </div>
        <div class="prog"><i id="pg" style="width:1%"></i></div>
        <div class="dim" style="font-size:11px;margin-top:5px" id="cnt"></div>
      </div>
      <div class="srch"><input type="text" id="q" placeholder="поиск элемента…"></div>
      <div id="pal"></div>
    </aside>
  </main>
  <footer>

    <div class="grp"><label>T° среды</label><input type="range" id="rT" min="-60" max="120" value="20"><span class="dim" id="vT" style="font-size:11px">20</span></div>
    <div class="grp"><label>ВЕТЕР</label><input type="range" id="rW" min="-10" max="10" value="0"><span class="dim" id="vW" style="font-size:11px">0</span></div>
    <div class="grp"><label>ВРЕМЯ</label><input type="range" id="rS" min="1" max="30" value="10"><span class="dim" id="vS" style="font-size:11px">1.0</span></div>
    <span class="sep"></span>
    <button id="bPause" class="mini">⏸ Пауза</button>
    <button id="bTherm" class="mini">🌡 Тепловизор</button>
    <button id="bSnd" class="mini">🔇 Звук</button>
    <select id="selScene" style="background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px;font-size:12px">
      <option value="">Сцены…</option><option value="empty">Пустота</option><option value="lake">Озеро</option><option value="volcano">Вулкан</option><option value="garden">Сад</option><option value="space">Космос</option><option value="storm">Шторм</option>
    </select>
    <select id="selQ" style="background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px;font-size:12px">
      <option value="0">Сетка 256×144</option><option value="1" selected>Сетка 352×208</option><option value="2">Сетка 448×256</option>
    </select>
    <button id="bSave" class="mini">💾 Мир</button>
    <button id="bLoad" class="mini">📂 Загрузить</button>
    <button id="bReset" class="mini">↺ Прогресс</button>
  </footer>
</div>
<div id="modal"><div class="sheet"><div class="tabs">
  <button data-tab="el" class="on">Элементы</button><button data-tab="rx">Рецепты</button><button data-tab="law">Законы физики</button><button data-tab="about">О проекте</button>
  <span style="flex:1"></span><button id="bClose">✕ Закрыть</button>
</div><div class="body" id="mbody"></div></div></div>

function alloc(w,h){
 W=w;H=h;N=w*h;CW=w/CS;CH=h/CS;NC=CW*CH;
 tp=new Uint16Array(N);T=new Float32Array(N);lf=new Int16Array(N);vx=new Int8Array(N);vy=new Float32Array(N);
 q=new Float32Array(N);enth=new Float32Array(N);res=new Uint16Array(N);mv=new Uint8Array(N);lum=new Uint8Array(N);
 aw=new Uint8Array(NC);cix=new Uint16Array(N);noise=new Uint8Array(N);bg=new Uint32Array(N);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;cix[i]=(y/CS|0)*CW+(x/CS|0);noise[i]=(Math.random()*4)|0;T[i]=AMB;}
 cv.width=W;cv.height=H;ctx=cv.getContext('2d',{alpha:false});
 img=ctx.createImageData(W,H);px=new Uint32Array(img.data.buffer);
 box.style.aspectRatio=W+'/'+H;
 buildBg();fit();
}
function buildBg(){
 for(let y=0;y<H;y++){const t=y/H;const r=(9+t*7)|0,g=(12+t*10)|0,b=(22+t*18)|0;
  for(let x=0;x<W;x++){const n=((x*7+y*13)%5)-2;bg[y*W+x]=(255<<24)|((b+n)<<16)|((g+n)<<8)|(r+n);}}
}
function buildPal(){
 PAL=new Uint32Array(M*4);
 for(let i=0;i<M;i++){const c=EL[i].col,r=(c>>16)&255,g=(c>>8)&255,b=c&255;
  for(let k=0;k<4;k++){const f=.88+k*.075;
   PAL[(i<<2)|k]=(255<<24)|(Math.min(255,b*f|0)<<16)|(Math.min(255,g*f|0)<<8)|Math.min(255,r*f|0);}}
 TLUT=new Uint32Array(256);
 for(let i=0;i<256;i++){const t=i/255;let r,g,b;
  if(t<.25){r=0;g=t*4*200;b=120+t*4*135;}
  else if(t<.5){r=0;g=200;b=255-(t-.25)*4*255;}
  else if(t<.75){r=(t-.5)*4*255;g=220;b=0;}
  else{r=255;g=220-(t-.75)*4*180;b=(t-.75)*4*220;}
  TLUT[i]=(255<<24)|((b|0)<<16)|((g|0)<<8)|(r|0);}
}

function wake(i){const c=cix[i];aw[c]=AW;
 if(i>0)aw[cix[i-1]]=AW;if(i<N-1)aw[cix[i+1]]=AW;if(i>=W)aw[cix[i-W]]=AW;if(i<N-W)aw[cix[i+W]]=AW;}
function set(i,t,tt){
 tp[i]=t;T[i]=tt===undefined?(P_t0[t]||AMB):tt;lf[i]=P_life[t];vx[i]=0;vy[i]=0;q[i]=0;enth[i]=0;res[i]=0;mv[i]=1;
 if(P_grow[t])lf[i]=5+(Math.random()*5|0);
 wake(i);if(t&&!disc[t])unlock(t);
}
function swap(i,j){
 let a=tp[i];tp[i]=tp[j];tp[j]=a;
 let b=T[i];T[i]=T[j];T[j]=b;
 let c=lf[i];lf[i]=lf[j];lf[j]=c;
 let d=vx[i];vx[i]=vx[j];vx[j]=d;
 let e=vy[i];vy[i]=vy[j];vy[j]=e;
 let f=q[i];q[i]=q[j];q[j]=f;
 let g=enth[i];enth[i]=enth[j];enth[j]=g;
 let h=res[i];res[i]=res[j];res[j]=h;
 mv[j]=1;wake(i);wake(j);
}
function nb(i,x,y,k){const nx=x+DX[k],ny=y+DY[k];return(nx<0||nx>=W||ny<0||ny>=H)?-1:ny*W+nx;}
function stepDir(i,d){const x=i%W,y=i/W|0,nx=x+DDX[d],ny=y+DDY[d];return(nx<0||nx>=W||ny<0||ny>=H)?-1:ny*W+nx;}
function rhoAt(i){const t=tp[i];
 if(t){const ph=P_ph[t];if(ph!==5&&ph!==6)return P_rho[t];}
 const r=t?P_rho[t]:1.2,f=1-(T[i]-20)*.0034;return r*(f<.05?.05:f);}
function canMove(i,j,dir){
 if(j<0)return false;const b=tp[j];
 if(b!==0&&!P_fluid[b])return false;
 const r1=rhoAt(i),r2=rhoAt(j);
 if(dir>0)return r2<r1*.98;
 if(dir<0)return r2>r1*1.02;
 return b===0||r2<r1*.9;
}
function hasOx(i,x,y){for(let k=0;k<4;k++){const j=nb(i,x,y,k);if(j<0)continue;const u=tp[j];
 if(u===0||u===ID.ox||u===ID.ai||u===ID.atm)return true;}return false;}
function die(i,t){
 if(P_cnd[t]){set(i,P_cnd[t],P_tb[t]);return;}
 if(t===ID.fi||t===ID.met){const r=res[i];
  if(r&&Math.random()<.6)set(i,r);else if(Math.random()<.45)set(i,ID.sm);else set(i,0);return;}
 set(i,0);
}
function ignite(i){
 const t=tp[i],f=P_fuel[t];
 if(P_expl[t]){boom(i,5+5*P_expl[t],f);return;}
 const b=P_burn[t];set(i,ID.fi);res[i]=b;lf[i]=25+(f/45|0);T[i]=Math.max(T[i],P_t0[ID.fi]);
}
function boom(i,r,pw){
 if(r>18)r=18;const x=i%W,y=i/W|0;
 for(let dy=-r;dy<=r;dy++){const ny=y+dy;if(ny<0||ny>=H)continue;
  for(let dx=-r;dx<=r;dx++){const nx=x+dx;if(nx<0||nx>=W)continue;
   const d2=dx*dx+dy*dy;if(d2>r*r)continue;
   const j=ny*W+nx,d=Math.sqrt(d2)+.6,f=1-d/r,t=tp[j];
   T[j]+=pw*.015*f;
   if(t){const ph=P_ph[t];
    if(ph===1){if(Math.random()<f*.5)set(j,ID.du);}
    else{vx[j]=Math.max(-7,Math.min(7,vx[j]+Math.round(dx/d*f*6)));
         vy[j]=Math.max(-7,Math.min(7,vy[j]+Math.round(dy/d*f*6)));}}
   if(d<2.2&&Math.random()<.7)set(j,ID.fi);
   else if(Math.random()<f*.2)set(j,ID.sm);
   wake(j);}}
}
function fission(j){
 T[j]+=6000;boom(j,5,3000);set(j,ID.rad);unlock(ID.fis);
 for(let k=0;k<4;k++){const n=nb(j,j%W,j/W|0,k);if(n>=0&&tp[n]===0&&Math.random()<.7)set(n,ID.neut);}
}
function radial(i,x,y,r,fn){

 for(let dy=-r;dy<=r;dy++){const ny=y+dy;if(ny<0||ny>=H)continue;
  for(let dx=-r;dx<=r;dx++){const nx=x+dx;if(nx<0||nx>=W)continue;
   const d2=dx*dx+dy*dy;if(d2>r*r)continue;fn(ny*W+nx,dx,dy,d2);}}
}

/* ---------- контактные реакции (химия в мире) ---------- */
function react(i,j,t){
 const u=tp[j];if(!u)return;const A=ID;
 if(P_aq[t]){
  if(u===A.fi){lf[j]-=25;T[i]+=8;if(Math.random()<.22)set(i,A.st);return;}
  if(u===A.la){set(j,A.ro);set(i,A.st);return;}
  if(u===A.salt&&Math.random()<.3){set(j,0);set(i,A.sea);return;}
  if(u===A.sugar&&Math.random()<.2){set(j,0);return;}
  if(u===A.ink&&Math.random()<.2){set(j,0);return;}
  if(u===A.co&&Math.random()<.04){set(j,0);set(i,A.acid);return;}
  if(u===A.soil&&Math.random()<.05){set(j,A.mu);return;}
  if(u===A.ah&&Math.random()<.1){set(j,0);set(i,A.alk);return;}
  if(u===A.sm&&Math.random()<.05){set(j,0);set(i,A.ink);return;}
  if(u===A.iron&&Math.random()<.004){set(j,A.rust);return;}
  return;}
 if(P_acid[t]){
  if(u===A.alk){set(i,A.wa);set(j,A.salt);return;}
  if(u===A.iron||u===A.alu||u===A.steel){if(Math.random()<.2){set(j,A.hy);if(Math.random()<.3)set(i,0);}return;}
  const ph=P_ph[u];
  if((ph===1||ph===2||ph===3)&&u!==A.gl&&u!==A.dia&&Math.random()<.14){set(j,ph===2?A.sa:0);if(Math.random()<.25)set(i,0);}
  return;}
 if(t===A.alk){
  if(u===A.oil||u===A.wax){if(Math.random()<.2){set(j,A.soap);set(i,A.wa);}return;}
  if(u===A.acid){set(i,A.salt);set(j,A.wa);}return;}
 if(t===A.salt&&(u===A.ic||u===A.sn)){T[j]-=8;if(T[j]>-21&&Math.random()<.2){set(j,A.wa);set(i,0);}return;}
 if(t===A.co&&lum[i]>25&&P_grow[u]&&Math.random()<.1){set(i,A.ox);return;}
 if(t===A.iron&&u===A.ox&&Math.random()<.02){set(i,A.rust);set(j,0);return;}
 if(t===A.rust&&u===A.fi&&Math.random()<.1){set(i,A.iron);return;}
 if(t===A.sa&&u===A.lt){set(i,A.gl);return;}
 if(t===A.cl&&u===A.fi&&Math.random()<.04){set(i,A.brick);return;}
 if(t===A.st&&(u===A.ic||u===A.sn)){set(i,A.wa);return;}
 if(t===A.life&&P_aq[u]&&Math.random()<.05){set(j,A.cell);return;}
 if(t===A.poi){const s=P_sp[u];if((s===SP.life||s===SP.cell||s===SP.swim||s===SP.fly||s===SP.crawl||s===SP.hop)&&Math.random()<.2)set(j,0);return;}
 if(t===A.med&&(u===A.vir||u===A.bact)&&Math.random()<.2){set(j,0);return;}
 if(t===A.fert&&P_grow[u]&&Math.random()<.1){lf[j]+=3;return;}
}

/* ---------- scripted-поведение (38 скриптов) ---------- */
function script(i,x,y,t,sp){
 const A=ID;
 switch(sp){
 case SP.grow:{
  if(lf[i]>0&&Math.random()<.05&&lum[i]>25){const up=nb(i,x,y,0);
   if(up>=0&&tp[up]===0){set(up,t);lf[up]=lf[i]-1;lf[i]=0;}}
  if(Math.random()<.03){const dn=nb(i,x,y,1),up=nb(i,x,y,0);
   if(dn>=0&&up>=0&&P_aq[tp[dn]]&&tp[up]===0){set(up,A.wa);set(dn,0);}}
  return true;}
 case SP.tree:{
  if(lf[i]>0&&Math.random()<.09){const up=nb(i,x,y,0);
   if(up>=0&&tp[up]===0){set(up,lf[i]>3?A.tree:A.leaf);lf[up]=lf[i]-1;lf[i]=0;}}
  if(lf[i]<=0&&Math.random()<.003){const j=nb(i,x,y,(Math.random()*4)|0);
   if(j>=0&&tp[j]===0)set(j,Math.random()<.25?A.fruit:A.leaf);}
  return true;}
 case SP.sprout:{
  const dn=nb(i,x,y,1);
  if(dn>=0){const b=tp[dn];
   if(b===A.soil||b===A.mu||b===A.gr||b===A.hum||b===A.fert){set(i,A.tree);lf[i]=7+(Math.random()*6|0);return true;}}
  return false;}
 case SP.cloud:{
  if(Math.random()<.004){const dn=nb(i,x,y,1);if(dn>=0&&tp[dn]===0)set(dn,T[i]<2?A.sn:A.rn);}
  gasMove(i,x,y,t,5);return true;}
 case SP.wind:{
  let d=vx[i]||1;
  for(let s=0;s<3;s++){const nx=x+d;if(nx<0||nx>=W)break;const j=i+d;
   if(tp[j]===0){swap(i,j);i=j;x=nx;}
   else{const ph=P_ph[tp[j]];if(ph===3||ph===5||ph===2){vx[j]=Math.max(-6,Math.min(6,vx[j]+d*2));wake(j);}break;}}
  return true;}
 case SP.storm:{
  if(Math.random()<.006){const dn=nb(i,x,y,1);
   if(dn>=0&&tp[dn]===0){if(Math.random()<.3){set(dn,A.lt);q[dn]=255;}else set(dn,A.rn);}}
  gasMove(i,x,y,t,5);return true;}
 case SP.bolt:{
  T[i]=9000;let best=-1,bs=-1;
  const cand=[[0,1],[-1,1],[1,1],[-1,0],[1,0]];
  for(let k=0;k<5;k++){const nx=x+cand[k][0],ny=y+cand[k][1];
   if(nx<0||nx>=W||ny<0||ny>=H)continue;const j=ny*W+nx,u=tp[j];
   let s=Math.random()*2+(u===0?1:0)+P_ec[u]*3+(q[j]>10?2:0)+(cand[k][1]>0?1:0);
   if(P_ph[u]===1&&P_ec[u]<=0)s-=2;
   if(s>bs){bs=s;best=j;}}
  if(best>=0){const u=tp[best];
   if(P_ign[u]>0)ignite(best);
   T[best]+=2500;set(best,A.lt);q[best]=255;lf[best]=lf[i]>1?lf[i]-1:1;}
  return true;}
 case SP.vortex:{
  radial(i,x,y,7,(j,dx,dy,d2)=>{if(d2<1)return;const u=tp[j];if(!u||P_ph[u]===1)return;
   const f=1.4/Math.sqrt(d2);
   vx[j]=Math.max(-6,Math.min(6,vx[j]+Math.round((-dy*.7-dx*.3)*f)));
   vy[j]=Math.max(-6,Math.min(6,vy[j]+Math.round((dx*.7-dy*.4)*f)));wake(j);});
  gasMove(i,x,y,t,5);return true;}
 case SP.volcano:{
  if(Math.random()<.025){const up=nb(i,x,y,0);
   if(up>=0&&(tp[up]===0||P_ph[tp[up]]===5)){set(up,A.la);vy[up]=-3;}
   if(Math.random()<.4&&up>=0&&tp[up]===0)set(up,A.sm);}
  return true;}
 case SP.geyser:{
  if(Math.random()<.05){const up=nb(i,x,y,0);if(up>=0&&tp[up]===0){set(up,A.st,150);vy[up]=-4;}}
  return true;}
 case SP.magnet:{
  radial(i,x,y,10,(j,dx,dy,d2)=>{if(!P_mag[tp[j]])return;const f=7/(d2+2);
   vx[j]=Math.max(-6,Math.min(6,vx[j]-Math.round(dx*f)));
   vy[j]=Math.max(-6,Math.min(6,vy[j]-Math.round(dy*f)));wake(j);});
  return true;}
 case SP.charge:{
  q[i]=200;const j=nb(i,x,y,(Math.random()*4)|0);
  if(j>=0){if(P_ec[tp[j]]>0){q[j]=Math.max(q[j],200);wake(j);}if(tp[j]===0)swap(i,j);}
  return true;}

 case SP.rocket:{

/* ---------- движение по фазам ---------- */
function granular(i,x,y,t,ph){
 let v=vx[i];
 if(v){const d=v>0?1:-1,nx=x+d;
  if(nx>=0&&nx<W){const j=i+d;if(canMove(i,j,0)){swap(i,j);vx[j]=v-d;i=j;x=nx;}else vx[i]=0;}else vx[i]=0;}
 let vv=vy[i]+GACC;if(vv>6)vv=6;
 let n=vv|0;if(Math.random()<vv-n)n++;
 let cy=y,blocked=false;
 for(let s=0;s<n;s++){
  if(cy+1>=H){blocked=true;break;}
  const j=i+W;
  if(canMove(i,j,1)){swap(i,j);i=j;cy++;}else{blocked=true;break;}}
 vy[i]=blocked?0:vv;
 if(blocked&&ph===3&&Math.random()>P_ang[t]){
  const d=Math.random()<.5?-1:1,nx=x+d;
  if(nx>=0&&nx<W&&cy+1<H){const s1=i+d,s2=i+d+W;
   if(canMove(i,s1,0)&&canMove(i,s2,1)){swap(i,s2);vy[s2]=1;}}}
}
function liquid(i,x,y,t){
 let v=vx[i];
 if(v){const d=v>0?1:-1,nx=x+d;
  if(nx>=0&&nx<W){const j=i+d;if(canMove(i,j,0)){swap(i,j);vx[j]=v-d;i=j;x=nx;}else vx[i]=0;}else vx[i]=0;}
 let vv=vy[i]+GACC;if(vv>8)vv=8;
 let n=vv|0;if(Math.random()<vv-n)n++;
 let cy=y,blocked=false;
 for(let s=0;s<n;s++){
  if(cy+1>=H){blocked=true;break;}
  const j=i+W;
  if(canMove(i,j,1)){swap(i,j);i=j;cy++;}else{blocked=true;break;}}
 vy[i]=blocked?0:vv;
 if(!blocked)return;
 const sp=P_spread[t];
 for(let side=0;side<2;side++){
  const d=side===0?(Math.random()<.5?-1:1):0;
  if(side===1){if(!vx[i]&&!vy[i]){} }
  const dir=side===0?d:-d;if(side===1&&d===0)continue;
  let target=-1;
  for(let s=1;s<=sp;s++){
   const nx=x+dir*s;if(nx<0||nx>=W)break;const j=i+dir*s;
   if(!canMove(i,j,0))break;
   target=j;
   if(cy+1<H&&canMove(j,j+W,1))break;}
  if(target>=0){swap(i,target);return;}
  if(side===0&&d!==0)continue;else break;}
}
function gasMove(i,x,y,t,ph){
 if(WIND&&Math.random()<Math.abs(WIND)*.45){
  const d=WIND>0?1:-1,nx=x+d;
  if(nx>=0&&nx<W){const j=i+d;if(canMove(i,j,0)){swap(i,j);return;}}}
 let v=vx[i];
 if(v){const d=v>0?1:-1,nx=x+d;
  if(nx>=0&&nx<W){const j=i+d;if(canMove(i,j,0)){swap(i,j);vx[j]=v-d;return;}else vx[i]=0;}}
 if(y>0&&canMove(i,i-W,-1)&&Math.random()<.75){swap(i,i-W);return;}
 if(Math.random()<.5){const j=nb(i,x,y,(Math.random()*4)|0);if(j>=0&&canMove(i,j,0))swap(i,j);}
}
function airCell(i,x,y){
 const t=T[i];
 if(t>AMB+3&&y>0&&tp[i-W]===0&&T[i-W]<t-1){const a=T[i];T[i]=T[i-W];T[i-W]=a;wake(i);wake(i-W);}
 if(q[i]>150){set(i,ID.lt);q[i]=255;}
}
function upd(i,x,y){
 if(!aw[cix[i]]||mv[i])return;
 const t=tp[i];
 if(!t){airCell(i,x,y);return;}
 if(P_life[t]>0&&--lf[i]<=0){die(i,t);return;}
 const j=nb(i,x,y,(Math.random()*4)|0);
 if(j>=0)react(i,j,t);
 if(tp[i]!==t)return;
 if(P_rad[t]&&Math.random()<P_rad[t]*.002){
  const n=nb(i,x,y,(Math.random()*4)|0);if(n>=0&&tp[n]===0)set(n,ID.rad);T[i]+=25;}
 if(P_ign[t]>0&&T[i]>=P_ign[t]&&hasOx(i,x,y)){ignite(i);return;}
 if(P_ph[t]===6&&T[i]<P_t0[t])T[i]=P_t0[t];
 const sp=P_sp[t];
 if(sp&&script(i,x,y,t,sp))return;
 const ph=P_ph[t];
 if(ph===2||ph===3)granular(i,x,y,t,ph);
 else if(ph===4)liquid(i,x,y,t);
 else if(ph===5||ph===6)gasMove(i,x,y,t,ph);
}
function phase(i,t){
 const tt=T[i];
 if(P_melt[t]&&tt>P_tm[t]){const need=P_Lm[t]/P_cp[t];enth[i]+=tt-P_tm[t];T[i]=P_tm[t];
  if(enth[i]>=need)set(i,P_melt[t],P_tm[t]);return;}
 if(P_frz[t]&&tt<P_tm[t]){const need=P_Lm[t]/P_cp[t];enth[i]+=P_tm[t]-tt;T[i]=P_tm[t];
  if(enth[i]>=need)set(i,P_frz[t],P_tm[t]);return;}
 if(P_boil[t]&&tt>P_tb[t]){const need=P_Lb[t]/P_cp[t];enth[i]+=tt-P_tb[t];T[i]=P_tb[t];
  if(enth[i]>=need)set(i,P_boil[t],P_tb[t]);return;}
 if(P_cnd[t]&&tt<P_tb[t]){const need=P_Lb[t]/P_cp[t];enth[i]+=P_tb[t]-tt;T[i]=P_tb[t];
  if(enth[i]>=need)set(i,P_cnd[t],P_tb[t]);return;}
 if(enth[i]>0)enth[i]*=.995;
}
function heatPass(){
 for(let i=0;i<N;i++){
  if(!aw[cix[i]])continue;
  const t=tp[i],a=P_alpha[t],ti=T[i];let s=0;
  if(i>=W){const u=tp[i-W],c=P_alpha[u];s+=(a<c?a:c)*(T[i-W]-ti);}
  if(i<N-W){const u=tp[i+W],c=P_alpha[u];s+=(a<c?a:c)*(T[i+W]-ti);}
  const x=i%W;
  if(x>0){const u=tp[i-1],c=P_alpha[u];s+=(a<c?a:c)*(T[i-1]-ti);}
  if(x<W-1){const u=tp[i+1],c=P_alpha[u];s+=(a<c?a:c)*(T[i+1]-ti);}
  let nt=ti+s;
  nt+=(AMB-nt)*((t===0||P_ph[t]===5)?.006:.0015);
  if(nt>600){const r=(nt-AMB)/1000;nt-=r*r*r*.8;}
  if(nt<-273)nt=-273;
  T[i]=nt;
  if(Math.abs(nt-AMB)>.5||Math.abs(s)>.02)wake(i);
  if(t)phase(i,t);
 }
}
function elecPass(){
 for(let i=0;i<N;i++){
  if(!aw[cix[i]])continue;
  const qi=q[i];if(qi<2){if(qi)q[i]=0;continue;}
  const t=tp[i];
  if(!t){if(qi>150){set(i,ID.lt);q[i]=255;}else q[i]=qi*.7;continue;}
  const ec=P_ec[t];
  if(ec<=0){q[i]=qi*.9;continue;}
  let moved=0;const x=i%W;
  for(let k=0;k<4;k++){
   let j=-1;
   if(k===0&&i>=W)j=i-W;else if(k===1&&i<N-W)j=i+W;
   else if(k===2&&x>0)j=i-1;else if(k===3&&x<W-1)j=i+1;
   if(j<0)continue;
   const c2=P_ec[tp[j]];if(c2<=0)continue;
   const d=(qi-q[j])*.25*Math.min(ec,c2);
   if(d>.5){q[j]+=d;moved+=d;T[j]+=d*d*.0006*(1-c2);wake(j);}}
  q[i]=Math.max(0,qi-moved)*.97;
  T[i]+=moved*moved*.0004*(1-ec);
  if(P_aq[t]&&qi>60&&Math.random()<.05){
   const j=nb(i,x,i/W|0,(Math.random()*4)|0);set(i,ID.hy);if(j>=0&&tp[j]===0)set(j,ID.ox);}
  wake(i);
 }
}
function lightPass(){
 lum.fill(0);let b=1400;
 for(let i=0;i<N;i++){
  const t=tp[i];if(!t)continue;
  const g=P_glow[t];if(!g)continue;
  if(P_sp[t]===SP.lamp&&q[i]<8)continue;
  if(--b<0)break;
  const r=2+(g>>6),K=KERN[r>6?6:r],x=i%W,y=i/W|0;
  if(P_sp[t])aw[cix[i]]=AW;
  for(let k=0;k<K.n;k++){
   const nx=x+K.dx[k],ny=y+K.dy[k];if(nx<0||nx>=W||ny<0||ny>=H)continue;
   const j=ny*W+nx,v=(g*K.f[k])>>8;
   if(v>lum[j]){lum[j]=v;if(P_grow[tp[j]])aw[cix[j]]=AW;}}
 }
}
let nParts=0,avgT=20,nActive=0;
function stat(){
 if(frame%15)return;
 let n=0,s=0;for(let i=0;i<N;i++){if(tp[i])n++;s+=T[i];}
 let a=0;for(let c=0;c<NC;c++)if(aw[c])a++;
 nParts=n;avgT=s/N;nActive=a/NC;
 if(audio.on)audio.mix(n/N);
}
function step(){
 frame++;mv.fill(0);budget=45000;
 lightPass();
 const rev=(frame&1)===0;
 for(let y=H-1;y>=0;y--){const row=y*W;
  if(rev){for(let x=W-1;x>=0;x--)upd(row+x,x,y);}
  else{for(let x=0;x<W;x++)upd(row+x,x,y);}}
 heatPass();elecPass();
 for(let c=0;c<NC;c++)if(aw[c])aw[c]--;
 stat();
}
/* ---------- рендер ---------- */
function lit(c,l){const a=l*.5;let r=(c&255)+a,g=((c>>8)&255)+a,b=((c>>16)&255)+a;
 if(r>255)r=255;if(g>255)g=255;if(b>255)b=255;return(255<<24)|((b|0)<<16)|((g|0)<<8)|(r|0);}
function hot(c,tt){let f=(tt-350)/1000;if(f>1)f=1;
 const r=c&255,g=(c>>8)&255,b=(c>>16)&255;
 return(255<<24)|(((b*(1-f*.85))|0)<<16)|(((g+(180-g)*f*.9)|0)<<8)|((r+(255-r)*f)|0);}
function render(){
 if(thermal){
  for(let i=0;i<N;i++){let v=((T[i]+60)*.15)|0;if(v<0)v=0;if(v>255)v=255;px[i]=TLUT[v];}
 }else{
  for(let i=0;i<N;i++){
   const t=tp[i];let c;
   if(!t)c=bg[i];
   else{c=PAL[(t<<2)|noise[i]];const tt=T[i];
    if(tt>350&&P_ph[t]!==5)c=hot(c,tt);
    else if(tt<-8){const r=c&255,g=(c>>8)&255,b=(c>>16)&255;
     c=(255<<24)|(((b+(255-b)*.25)|0)<<16)|(((g+(235-g)*.2)|0)<<8)|((r+(205-r)*.2)|0);}}
   const l=lum[i];if(l)c=lit(c,l);
   px[i]=c;}
 }
 ctx.putImageData(img,0,0);
}
/* ---------- главный цикл: фиксированный шаг ---------- */
let acc=0,last=performance.now(),ms=0,fps=60,fAcc=0,fCnt=0;
function loop(now){
 const dt=Math.min(120,now-last);last=now;
 fAcc+=dt;fCnt++;if(fAcc>500){fps=1000/(fAcc/fCnt);fAcc=0;fCnt=0;}
 const t0=performance.now();
 if(!paused){acc+=dt*SPEED;let n=0;
  while(acc>=16.6667&&n<3){step();acc-=16.6667;n++;}
  if(acc>60)acc=0;}
 if(ptr.down&&tool>=2)paintAt(ptr.gx,ptr.gy);
 render();
 ms=ms*.9+(performance.now()-t0)*.1;
 if(palDirty){buildPalette();palDirty=false;}
 hud.textContent='fps '+fps.toFixed(0)+'   кадр '+ms.toFixed(1)+' мс\nчастиц '+nParts+'   активных чанков '+(nActive*100|0)+'%\nT сред '+avgT.toFixed(1)+'°C   шаг '+(frame%100000);
 requestAnimationFrame(loop);
}

function toGrid(e){const r=cv.getBoundingClientRect();
 return[Math.max(0,Math.min(W-1,((e.clientX-r.left)/r.width*W)|0)),Math.max(0,Math.min(H-1,((e.clientY-r.top)/r.height*H)|0))];}
function paintAt(gx,gy){
 const r=brush,t=sel;
 for(let dy=-r;dy<=r;dy++){const ny=gy+dy;if(ny<0||ny>=H)continue;
  for(let dx=-r;dx<=r;dx++){const nx=gx+dx;if(nx<0||nx>=W)continue;
   if(dx*dx+dy*dy>r*r)continue;const i=ny*W+nx;
   if(tool===0){const ph=P_ph[t];if(ph===8)continue;
    const fill=ph===1?1:(ph===5||ph===6?.35:.75);
    if(Math.random()<fill&&(tp[i]===0||ph===1)){set(i,t);if(t===ID.las||t===ID.light)res[i]=2;}}
   else if(tool===1){if(tp[i])set(i,0);T[i]=AMB;q[i]=0;enth[i]=0;wake(i);}
   else if(tool===2){T[i]=Math.min(20000,T[i]+45);wake(i);}
   else if(tool===3){T[i]=Math.max(-273,T[i]-45);wake(i);}
   else if(tool===4){q[i]=255;wake(i);}
   else if(tool===5){const d=Math.sqrt(dx*dx+dy*dy)+.6;
    vx[i]=Math.max(-7,Math.min(7,vx[i]+Math.round(dx/d*5)));
    vy[i]=Math.max(-7,Math.min(7,vy[i]+Math.round(dy/d*5)));wake(i);}}}
}
function line(x0,y0,x1,y1){
 const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),n=Math.max(dx,dy);
 if(n===0){paintAt(x1,y1);return;}
 for(let s=0;s<=n;s++)paintAt(Math.round(x0+(x1-x0)*s/n),Math.round(y0+(y1-y0)*s/n));
}

function fillRect(x0,y0,x1,y1,t,tt){for(let y=Math.max(0,y0);y<Math.min(H,y1);y++)for(let x=Math.max(0,x0);x<Math.min(W,x1);x++)set(y*W+x,t,tt);}
function scene(name){
 clearWorld();const g=H-14;
 if(name==='empty')return;
 if(name==='lake'){fillRect(0,g,W,H,ID.sa);fillRect(W*.25|0,g-16,W*.75|0,g,ID.wa);
  fillRect(0,g-3,W*.25|0,g,ID.soil);fillRect(W*.75|0,g-3,W,g,ID.soil);
  fillRect(W*.1|0,g-6,W*.16|0,g-3,ID.ro);}
 if(name==='volcano'){fillRect(0,g,W,H,ID.ro);
  for(let y=0;y<26;y++){const w=30-y;fillRect((W/2-w)|0,g-y,(W/2+w)|0,g-y+1,ID.ro);}
  fillRect((W/2-3)|0,g-26,(W/2+3)|0,g-20,ID.la,1250);set((g-27)*W+(W/2|0),ID.vol);}
 if(name==='garden'){fillRect(0,g,W,H,ID.soil);fillRect(0,g-2,W,g,ID.gr);
  for(let x=10;x<W;x+=34){set((g-3)*W+x,ID.seed);}
  fillRect(W*.6|0,g-8,W*.8|0,g,ID.wa);set(20*W+(W*.3|0),ID.sun);}
 if(name==='space'){fillRect(0,0,W,H,ID.vac);set((H/2|0)*W+(W/2|0),ID.star);
  for(let k=0;k<160;k++){const x=Math.random()*W|0,y=Math.random()*H|0;set(y*W+x,ID.hy);}
  set((H*.2|0)*W+(W*.8|0),ID.bh);}
 if(name==='storm'){fillRect(0,g,W,H,ID.soil);fillRect(W*.2|0,g-10,W*.8|0,g,ID.sea);
  fillRect(0,6,W,16,ID.cld);fillRect(W*.3|0,16,W*.7|0,20,ID.sto);}
}

/* ============================================================
   6. ПРОЦЕДУРНЫЙ ЗВУК (медитативный дрон + колокольчики)
   ============================================================ */
const audio={ctx:null,on:false,noise:null,ng:null,
 start(){if(this.ctx||!this.on)return;this.init();},
 init(){try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=new C();this.ctx=c;
  const g=c.createGain();g.gain.value=.055;g.connect(c.destination);this.master=g;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;lp.Q.value=.6;lp.connect(g);
  [55,82.5,110.3].forEach((f,i)=>{const o=c.createOscillator();o.type=i===2?'triangle':'sine';o.frequency.value=f;
   const og=c.createGain();og.gain.value=.5;o.connect(og);og.connect(lp);o.start();
   const l=c.createOscillator();l.frequency.value=.03+i*.017;const lg=c.createGain();lg.gain.value=.3;
   l.connect(lg);lg.connect(og.gain);l.start();});
  const n=c.createBufferSource(),buf=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=buf.getChannelData(0);
  let v=0;for(let i=0;i<d.length;i++){v=(v+(Math.random()*2-1)*.08)*.96;d[i]=v;}
  n.buffer=buf;n.loop=true;const nf=c.createBiquadFilter();nf.type='bandpass';nf.frequency.value=700;nf.Q.value=.4;
  const ng=c.createGain();ng.gain.value=0;n.connect(nf);nf.connect(ng);ng.connect(g);n.start();this.ng=ng;
 }catch(e){}},
 mix(d){if(this.ng)this.ng.gain.value=Math.min(.35,d*.6);},
 bell(){if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime;
  const f=[523.25,587.33,698.46,783.99,880][(Math.random()*5)|0];
  const o=c.createOscillator();o.type='sine';o.frequency.value=f;
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+2.4);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+2.5);},
 toggle(){this.on=!this.on;if(this.on){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
   if(this.master)this.master.gain.value=.055;}else if(this.master)this.master.gain.value=0;
  $('bSnd').textContent=this.on?'🔊 Звук':'🔇 Звук';$('bSnd').classList.toggle('on',this.on);}
};
$('bSnd').onclick=()=>audio.toggle();
